# Backup for GitHub's best-effort scheduled events.
# Check the Taipei and US Pacific windows from pages.yml after giving each scheduled run 45 minutes to start.
# Request a recovery if there is still no successful or active Pages build for the latest due window.
name: Recover missed site refreshes

on:
  schedule:
    - cron: '29 6-9,18-21 * * *'
      timezone: 'Asia/Taipei'
    - cron: '29 11-13 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  # One-time self-check when this watchdog is added or modified.
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-watchdog.yml'

permissions:
  actions: write

concurrency:
  group: pages-refresh-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger recovery only when the refresh window was missed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          now=$(date -u +%s)
          # A watchdog delayed into the next window should still give that window its usual grace period.
          cutoff=$((now - 45 * 60))
          slot=0
          for window in 'Asia/Taipei 05:43' 'Asia/Taipei 17:43' 'America/Los_Angeles 10:43'; do
            read -r zone local_time <<< "$window"
            local_day=$(TZ="$zone" date -d "@$cutoff" +%F)
            candidate=$(TZ="$zone" date -d "$local_day $local_time" +%s)
            if (( candidate > cutoff )); then
              previous_day=$(TZ="$zone" date -d "$local_day yesterday" +%F)
              candidate=$(TZ="$zone" date -d "$previous_day $local_time" +%s)
            fi
            if (( candidate > slot )); then
              slot=$candidate
            fi
          done
          since=$(date -u -d "@$slot" +%Y-%m-%dT%H:%M:%SZ)
          echo "Refresh window began at $since (UTC)"

          runs_json="$RUNNER_TEMP/pages-workflow-runs.json"
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?per_page=30" > "$runs_json"; then
            if jq -e --arg since "$since" '
              any(.workflow_runs[];
                .created_at >= $since
                and (.conclusion == "success" or .status != "completed"))
            ' "$runs_json" > /dev/null; then
              echo "A successful or active site build exists for this window. No fallback needed."
              exit 0
            fi
          else
            echo "::warning::Unable to read workflow history; requesting a recovery build."
          fi

          echo "::notice::Missing successful site build since $since; dispatching pages.yml."
          gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
