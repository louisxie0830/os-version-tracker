# Rebuilds the static site from the latest official sources and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repository secrets: NOTIFY_WEBHOOK_URL (new requirements), ALERT_WEBHOOK_URL (source failures).
# Optional repository variable: SITE_URL (defaults to https://<owner>.github.io/<repo>).
name: Build and deploy site

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, and only the deploy job may publish Pages
permissions:
  contents: read

# Never run two builds at once (the state handed between runs would race); don't cancel a deploy midway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: dependencies' install scripts never run on the runner
      - run: npm ci --ignore-scripts

      - run: npm test

      # State handed between runs ("first seen" times, undelivered notifications, alert streaks).
      # Each run saves a new entry; restore-keys picks the most recent one.
      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: pages-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-state-

      - name: Build static site
        run: |
          export SITE_URL="${SITE_URL_OVERRIDE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          npm run build:static
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Read-only token; only raises the GitHub search rate limit for the SDK crash reports
          GITHUB_TOKEN: ${{ github.token }}

      # Saved even when the build fails, so the next run knows which failures were already alerted
      - name: Save state
        if: always() && hashFiles('.state/*.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: pages-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
