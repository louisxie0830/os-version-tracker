ign currency accounts, investment assets and negative equity balances and details are clear at a glance.\u003cbr\u003e[Transfer transaction] It can perform functions such as Taiwan dollar agreed transfer, Taiwan dollar non-agreement transfer, and foreign currency exchange.\u003cbr\u003e[Credit Card] Pay credit card fees, check bills/credit card limits, credit card payment, marketing campaign registration, online credit card application, etc.... related information.\u003cbr\u003e[Investment and financial management] You can query the present value of investment, regular quota, investment transaction details, realized profit and loss, and portfolio analysis, allowing you to quickly grasp the current investment situation, and make purchases, conversions, and conversions at any time in accordance with the changes in the funds and wealth management product market at hand. Redemption, modification and financial management, etc.\u003cbr\u003e【Interest Rate Query】Provide query on interest rates related to deposits and loans of the bank, purchase and sell exchange rates of various foreign currencies of the bank, and currency conversion.\u003cbr\u003e[Settings] Provide quick login/transaction confirmation settings, and provide traditional Chinese/English language settings.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eThe Android version of Shanghai Commercial Savings Bank \u0026quot;Mobile Banking\u0026quot; may have the following permissions:\u003cbr\u003e1. Location: Find the locations of branches, ATMs, discount stores, cooperative parking lots, and their relative locations to you.\u003cbr\u003e2. Telephone: call the customer service center.\u003cbr\u003e3. Contact information: For Taiwan dollar (non) agreed transfer transactions, you can specify the person in your contact information to send the transfer transaction notification email.\u003cbr\u003e4. Photos, camera: Import or export commonly used QRcode pictures, or use the camera to scan the QRcode to simplify the transaction operation process for non-contractual transfers of Taiwan dollars.\u003cbr\u003e5. Notification center and device ID: If you want to receive various notifications (such as notification of account changes, payment notifications, etc.) to easily grasp the movement of account funds, you can set up to receive notification messages in the APP.\u003cbr\u003e6. The mobile online banking APP may collect sensitive information such as your ID number, user code, bank account number, etc., to verify the information you keep with the bank and verify that you have the authority to use APP-related services.\u003cbr\u003e\u003cbr\u003eRemind you, to ensure your accounting security, please install anti-virus software on your mobile device to prevent data from being stolen or leaked, and it is recommended that you update your operating system to the latest version."]],"Chinese (Traditional)","English (United States)"],["100,000+",100000,219027,"100K+"],null,null,null,null,[2],null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,["The Shanghai Commercial \u0026 Savings Bank"],null,null,null,null,[1,1,0],null,null,null,null,null,null,null,null,[["2.4",2.4],[null,["460",460],["106",106],["43",43],["53",53],["221",221]],["887",887],["597",597],null,[null,[]]],null,null,null,null,null,[[[[[null,[[0,"TWD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dtw.com.scsb.android.mbank\u0026rdid\u003dtw.com.scsb.android.mbank\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Install"],null,["CgYKBENBRT0\u003d"]]]],null,null,null,null,null,null,null,null,null,null,["The Shanghai Commercial \u0026 Savings Bank",[null,null,null,null,[null,null,"/store/apps/developer?id\u003dThe+Shanghai+Commercial+%26+Savings+Bank"]],"5356374631210525200"],[[null,null,null,null,null,[null,null,"https://www.scsb.com.tw/"]],["service@scsb.com.tw"],null,"+886225523111",["上海商業儲蓄銀行股份有限公司",["service@scsb.com.tw"],["104415台湾台北市中山區\n民權東路一段2號"],"+886 2 2567 1910"]],null,null,[[null,"上海商業儲蓄銀行「掌上銀」APP全新登場，提供指紋/人臉等生物辨識之快速登入、快速交易確認功能，並提供完整的帳務資訊、台幣約定轉帳、台幣非約定轉帳、投資理財基金申購/轉換/回贖及修改、信用卡帳單查詢/繳款、幣別換算小工具、匯利率資訊等…..您可隨時查詢存款明細、輕鬆轉帳繳費、並即時掌握匯市動態，除此之外，您也可查詢本行各分行營業據點，以及ATM相關資訊。\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e主要功能：\u003cbr\u003e\u003cbr\u003e【首頁】個人首頁可快速呈現台幣帳戶、信用卡、基金/集合等相關資訊，掌握銀行往來全貌。\u003cbr\u003e【帳務總覽】台幣帳戶、外幣帳戶、投資性資產及負資產餘額及明細一目瞭然。\u003cbr\u003e【轉帳交易】可進行台幣約定轉帳、台幣非約定轉帳及外幣兌換等功能。\u003cbr\u003e【信用卡】繳納信用卡費，查詢帳單/信用卡額度、信用卡繳款、行銷活動登錄及線上申請信用卡等….相關資訊。\u003cbr\u003e【投資理財】可查詢投資現值、定期定額、投資交易明細、已實現損益及投資組合分析，讓您快速掌握投資現況，依照自己手邊的資金和理財產品市場的變化，隨時進行申購、轉換、回贖、修改及理財妙管家等。\u003cbr\u003e【利匯率查詢】提供本行存款及放款相關利率查詢，及本行各種外幣之買進賣出匯率、並可進行幣別換算。\u003cbr\u003e【設定】提供快速登入/交易確認設定，及提供中文繁體/英文語言設定。\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e上海商業儲蓄銀行「行動銀行」Android版可能具備下列權限：\u003cbr\u003e1、位置：查找各個分行、提款機、優惠商店、合作停車場的所在位置，以及與您的相對位置。\u003cbr\u003e2、電話：撥打客服中心電話。\u003cbr\u003e3、聯絡資訊：台幣(非)約定轉帳交易，可指定您聯絡資訊內的對象發送轉帳交易通知Email。\u003cbr\u003e4、相片、相機：匯入或匯出常用的QRcode圖片，或是使用相機掃描QRcode，來簡化台幣非約轉的交易操作流程。\u003cbr\u003e5、通知中心和裝置ID：如您欲接收各項通知(如帳務金額異動通知、繳款通知等)，以輕鬆掌握帳戶資金動向，可於APP設定接收通知訊息。\u003cbr\u003e6、行動網銀APP可能蒐集您的身分證字號、使用者代號、銀行帳號等敏感性資料，以核實您在本行留存的資料及驗證您具有使用APP相關服務的權限。\u003cbr\u003e\u003cbr\u003e提醒您，為確保您的帳務安全，請於您的行動裝置上安裝防毒軟體，以避免資料遭竊或外洩，並建議您將作業系統更新至最新版本。"]],[[null,"Shanghai Commercial Savings Bank ``Handheld Bank'' provides complete account information, transfer transactions, comprehensive deposits and fixed deposits, investment and wealth management, loans, credit cards, interest rate inquiry, online counters, and fingerprint/face quick login and quick transaction confirmation, etc. Direction service"]],[null,null,[[["Identity",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/AUs-Fih7eEfuhp-4lYGGK65UvYQ2K6qaKi0dRUipSmiac-QL94IbT-XylwOgMoaYBDLuGOz1l5Yn_K6z1NM"]],[[null,"find accounts on the device"]],["perm_identity"]],["Contacts",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/c5fJsmDZCeHY1t
